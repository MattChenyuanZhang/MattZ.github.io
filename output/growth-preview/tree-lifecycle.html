<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tree growth stages</title><style>body{margin:0;color:#444;background:white;font:18px Georgia,serif}header{text-align:center;padding:25px 18px;position:relative;z-index:2}h1{font-size:28px;margin:0 0 12px}p{color:#888;font:14px Arial}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{background:white;border:1px solid #ddd;padding:9px 12px;color:#666;cursor:pointer}button[aria-pressed=true]{border-color:#8c9e83;color:#465842}label{display:block;margin:20px auto 10px;font:14px Arial;color:#888}input{width:min(420px,80vw);accent-color:#99ac90}#status{margin-top:12px}aside{font:13px Arial;color:#999}</style></head><body><header><h1>From seed to tree</h1><p>Two independent growth blueprints · accelerated study</p><nav id="stages"></nav><label>Growth timeline <input id="timeline" aria-label="Growth timeline" type="range" min="0" max="130" value="0"></label><nav><button id="play">Pause</button><button id="seed">Add a nearby seed</button><button onclick="location.reload()">New trees</button></nav><p id="status">Sprout</p><aside>Scrub the timeline to compare stages. Nearby seeds unlock later branches.</aside></header><script src="tree-lifecycle.js"></script><script>
const stages=[['Sprout',6],['Seedling',20],['Young tree',45],['Mature tree',78],['Aged tree',125]],nav=document.querySelector('#stages'),timeline=document.querySelector('#timeline'),play=document.querySelector('#play');
function control(detail){document.dispatchEvent(new CustomEvent('tree-preview-control',{detail}));}
for(const [label,value] of stages){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{control({progress:value/100,playing:false});play.textContent='Play';};nav.append(b);}
timeline.oninput=()=>{control({progress:+timeline.value/100,playing:false});play.textContent='Play';};
play.onclick=()=>{const playing=play.textContent==='Play';control({playing});play.textContent=playing?'Pause':'Play';};
document.querySelector('#seed').onclick=()=>control({seed:true});
setInterval(()=>{const c=document.querySelector('canvas');if(!c)return;const q=+c.dataset.previewProgress;timeline.max=Math.max(130,Math.ceil(q*100));timeline.value=q*100;document.querySelector('#status').textContent=(c.dataset.treeStages||'sprout').split(',').join(' · ');for(let i=0;i<nav.children.length;i++)nav.children[i].setAttribute('aria-pressed',Math.abs(q-stages[i][1]/100)<0.025);},150);
</script></body></html>
