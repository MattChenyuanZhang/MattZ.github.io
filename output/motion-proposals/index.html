<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion proposals</title>
<style>*{box-sizing:border-box}body{margin:0;color:#333;background:#fafaf8;font-family:Georgia,serif}header{padding:28px 5vw;border-bottom:1px solid #ddd}h1{font-size:30px;margin:0 0 12px}p{color:#777;line-height:1.55}button{padding:8px 12px;background:white;border:1px solid #ccc;border-radius:4px;cursor:pointer;color:#444}.grid{padding:30px 5vw;display:grid;grid-template-columns:1fr 1fr;gap:30px}.scene{height:310px;background:white;position:relative;isolation:isolate;overflow:hidden;border:1px solid #e3e3df}.scene canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.sample{padding:24px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:16px;font-size:13px}.nav strong{font-family:Arial}.copy{margin:50px auto 0;max-width:78%}.copy h3{font-size:25px}.copy p{font-size:16px;color:#555}.label{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.label h2{font-size:20px;margin:0}.full{position:fixed;inset:0;background:#fafaf8;padding:24px 4vw;z-index:5;overflow:auto}.full .scene{height:78vh}.full .sample{max-width:1050px;margin:auto}.full .copy{max-width:600px;margin-top:15vh}.full .copy h3{font-size:38px}.full .copy p{font-size:21px}.full .nav{font-size:19px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style>
<header><h1>A little movement, plenty of quiet.</h1><p>Six background directions for Matt Zhang. Expand a proposal and move your pointer over it.<br>Proposals only — your website is unchanged.</p><button id="pause">Pause motion</button></header><main class="grid" id="grid"></main>
<script>
const names=['Gentle waves','Quiet constellation','Water ripples','Flowing field','Leaf drift','Orbital paths'];
const desc=['Recommended. Three pale blue lines travel slowly across the margins, with a gentle response to your pointer.','Closest to Nathan’s approach. Sparse blue dots drift, connect nearby, and softly move away from your pointer.','Faint rings expand and disappear. Click in the preview to create a temporary ripple.','Tiny blue-gray strokes follow an invisible current. Your pointer bends the field.','A few sage leaves drift down the edges. A warmer companion to your leaf robot.','Two faint elliptical paths with slowly orbiting points. A quiet research and robotics character.'];
let paused=false,time=0,last=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,views=[];
for(let mode=0;mode<6;mode++){let card=document.createElement('section');card.innerHTML=`<div class="scene"><canvas aria-hidden="true"></canvas><div class="sample"><div class="nav"><strong>Matt Zhang</strong><span>Blog &nbsp; Projects &nbsp; Resources</span></div><div class="copy"><h3>Good things to learn from.</h3><p>Ideas, people, and tools that help us do better work.</p><p>How to do Great Work — Paul Graham</p></div></div></div><div class="label"><h2>${mode+1}. ${names[mode]}</h2><button>Expand</button></div><p>${desc[mode]}</p>`;grid.append(card);let scene=card.querySelector('.scene'),canvas=card.querySelector('canvas'),v={mode,scene,canvas,c:canvas.getContext('2d'),w:0,h:0,p:null,rings:[]};views.push(v);card.querySelector('button').onclick=e=>{e.target.textContent=card.classList.toggle('full')?'Close preview':'Expand';resize()};scene.onpointermove=e=>{let r=scene.getBoundingClientRect();v.p={x:e.clientX-r.left,y:e.clientY-r.top}};scene.onpointerleave=()=>v.p=null;scene.onclick=()=>{if(mode===2&&v.p)v.rings.push({...v.p,start:time})};}
function resize(){views.forEach(v=>{let r=v.scene.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);v.w=r.width;v.h=r.height;v.canvas.width=r.width*d;v.canvas.height=r.height*d;v.c.setTransform(d,0,0,d,0,0)})}addEventListener('resize',resize);resize();
function draw(v,t){let{c,w,h,mode}=v;c.clearRect(0,0,w,h);c.lineWidth=1;c.strokeStyle='rgba(125,163,181,.25)';c.fillStyle='rgba(125,163,181,.45)';
if(mode===0)for(let j=0;j<3;j++){c.beginPath();for(let x=0;x<=w;x+=4){let y=h*(.25+j*.28)+Math.sin(x/w*7+t*.28+j)*20;if(v.p)y+=Math.exp(-Math.pow((x-v.p.x)/110,2))*Math.sin(t)*5;x?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
if(mode===1){let pts=Array.from({length:16},(_,i)=>{let x=((i*.618+.13)%1)*w+Math.sin(t*.12+i)*15,y=((i*.383+.19)%1)*h+Math.cos(t*.14+i)*12;if(v.p){let dx=x-v.p.x,dy=y-v.p.y,d=Math.hypot(dx,dy);if(d<75&&d>0){x+=dx/d*(75-d)*.25;y+=dy/d*(75-d)*.25}}return{x,y}});pts.forEach((p,i)=>{c.beginPath();c.arc(p.x,p.y,2,0,7);c.fill();pts.slice(i+1).forEach(q=>{let d=Math.hypot(p.x-q.x,p.y-q.y);if(d<100){c.globalAlpha=(1-d/100)*.7;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(q.x,q.y);c.stroke();c.globalAlpha=1}})})}
if(mode===2){for(let i=0;i<3;i++){let phase=(t*.08+i/3)%1;c.globalAlpha=(1-phase)*.6;c.beginPath();c.arc(w*(i%2?.85:.12),h*(.25+i*.2),phase*180,0,7);c.stroke()}v.rings=v.rings.filter(r=>t-r.start<4);v.rings.forEach(r=>{let age=t-r.start;c.globalAlpha=1-age/4;c.beginPath();c.arc(r.x,r.y,age*48,0,7);c.stroke()});c.globalAlpha=1}
if(mode===3)for(let x=15;x<w;x+=33)for(let y=20;y<h;y+=34){let a=Math.sin(x*.007+t*.16)+Math.cos(y*.009+t*.13);if(v.p)a+=Math.exp(-Math.hypot(x-v.p.x,y-v.p.y)/100);c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*8,y+Math.sin(a)*8);c.stroke()}
if(mode===4){c.fillStyle='rgba(137,164,132,.28)';for(let i=0;i<9;i++){let x=(i%2?w*.94:w*.06)+Math.sin(t*.2+i)*12,y=((i*.137+t*.016)%1)*h;c.save();c.translate(x,y);c.rotate(Math.sin(t*.3+i)*.5+i);c.beginPath();c.ellipse(0,0,3,7,0,0,7);c.fill();c.restore()}}
if(mode===5)for(let i=0;i<2;i++){c.save();c.translate(i?w*.9:w*.1,i?h*.7:h*.3);c.rotate(-.6);c.beginPath();c.ellipse(0,0,100,45,0,0,7);c.stroke();let a=t*.16+i*2;c.beginPath();c.arc(Math.cos(a)*100,Math.sin(a)*45,3,0,7);c.fill();c.restore()}
c.globalCompositeOperation='destination-out';let fade=c.createRadialGradient(w*.5,h*.51,15,w*.5,h*.51,w*.32);fade.addColorStop(0,'rgba(0,0,0,.92)');fade.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=fade;c.fillRect(0,0,w,h);c.globalCompositeOperation='source-over';}
function frame(now){if(!paused&&!reduced)time+=Math.min((now-last)/1000,.05);last=now;views.forEach(v=>draw(v,time));requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume motion':'Pause motion'};addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.full').forEach(el=>{el.classList.remove('full');el.querySelector('button').textContent='Expand'});resize()}});
</script></html>
