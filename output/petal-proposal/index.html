<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Petal preview</title>
<style>*{box-sizing:border-box}body{margin:0;color:#333;background:#fafaf8;font-family:Georgia,serif}header{padding:28px 5vw;border-bottom:1px solid #ddd}h1{font-size:30px;margin:0 0 12px}p{color:#777;line-height:1.55}button{padding:8px 12px;background:white;border:1px solid #ccc;border-radius:4px;cursor:pointer;color:#444}.grid{padding:30px 5vw;display:grid;grid-template-columns:1fr 1fr;gap:30px}.scene{height:310px;background:white;position:relative;isolation:isolate;overflow:hidden;border:1px solid #e3e3df}.scene canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.sample{padding:24px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:16px;font-size:13px}.nav strong{font-family:Arial}.copy{margin:50px auto 0;max-width:78%}.copy h3{font-size:25px}.copy p{font-size:16px;color:#555}.label{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.label h2{font-size:20px;margin:0}.full{position:fixed;inset:0;background:#fafaf8;padding:24px 4vw;z-index:5;overflow:auto}.full .scene{height:78vh}.full .sample{max-width:1050px;margin:auto}.full .copy{max-width:600px;margin-top:15vh}.full .copy h3{font-size:38px}.full .copy p{font-size:21px}.full .nav{font-size:19px}@media(max-width:750px){.grid{grid-template-columns:1fr}}.grid{grid-template-columns:1fr;max-width:1350px;margin:auto}.scene{height:70vh;min-height:480px}.sample{max-width:1050px;margin:auto}.copy{max-width:600px;margin-top:13vh}.copy h3{font-size:34px}.copy p{font-size:20px}.nav{font-size:18px}</style>
<header><h1>A little spring, drifting by.</h1><p>One petal direction for your website. Expand a proposal to compare the movement at reading size.<br>Proposals only — your website is unchanged.</p><button id="pause">Pause motion</button></header><main class="grid" id="grid"></main>
<script>
const names=['Floating petals','Soft rain','Slow snow','Drifting petals','Falling stardust','Paper gliders'];
const desc=['Soft blush petals catch a slow breeze, turn in the air, and fade before they reach the bottom. The center stays quiet so reading comes first.'];
let paused=false,time=0,last=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,views=[];
for(let mode=0;mode<1;mode++){let card=document.createElement('section');card.innerHTML=`<div class="scene"><canvas aria-hidden="true"></canvas><div class="sample"><div class="nav"><strong>Matt Zhang</strong><span>Blog &nbsp; Projects &nbsp; Resources</span></div><div class="copy"><h3>Good things to learn from.</h3><p>Ideas, people, and tools that help us do better work.</p><p>How to do Great Work — Paul Graham</p></div></div></div><div class="label"><h2>${mode+1}. ${names[mode]}</h2><button>Expand</button></div><p>${desc[mode]}</p>`;grid.append(card);let scene=card.querySelector('.scene'),canvas=card.querySelector('canvas'),v={mode,scene,canvas,c:canvas.getContext('2d'),w:0,h:0,p:null,rings:[]};views.push(v);card.querySelector('button').onclick=e=>{e.target.textContent=card.classList.toggle('full')?'Close preview':'Expand';resize()};scene.onpointermove=e=>{let r=scene.getBoundingClientRect();v.p={x:e.clientX-r.left,y:e.clientY-r.top}};scene.onpointerleave=()=>v.p=null;scene.onclick=()=>{if(mode===2&&v.p)v.rings.push({...v.p,start:time})};}
function resize(){views.forEach(v=>{let r=v.scene.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);v.w=r.width;v.h=r.height;v.canvas.width=r.width*d;v.canvas.height=r.height*d;v.c.setTransform(d,0,0,d,0,0)})}addEventListener('resize',resize);resize();
function draw(v,t){let{c,w,h,mode}=v;c.clearRect(0,0,w,h);c.lineWidth=1;c.strokeStyle='rgba(125,163,181,.25)';c.fillStyle='rgba(125,163,181,.45)';
const count=17;mode=3;
for(let i=0;i<count;i++){
 let seed=(i*.618033+.17)%1, speed=mode===1?.20:mode===2?.025:mode===4?.07:.035;
 let phase=(t*speed*(.65+(i%5)*.12)+(i*.3819)%1)%1;
 let y=phase*(h+24)-12, drift=Math.sin(t*.35+i*2+phase*4)*(mode===1?3:18);
 let x=seed*w+drift+(mode===1?phase*24:0);
 let edge=Math.min(1,Math.abs(x-w*.5)/(w*.30));
 c.globalAlpha=Math.min(1,phase*12,(1-phase)*9)*(.35+.65*edge);
 if(mode===0){c.save();c.translate(x,y);c.rotate(t*.35+i+Math.sin(phase*6));c.fillStyle='rgba(126,155,115,.38)';c.strokeStyle='rgba(112,139,103,.35)';c.beginPath();c.moveTo(0,-7);c.bezierCurveTo(7,-3,5,4,0,7);c.bezierCurveTo(-5,3,-6,-3,0,-7);c.fill();c.beginPath();c.moveTo(0,-4);c.lineTo(0,8);c.stroke();c.restore();}
 if(mode===1){c.strokeStyle='rgba(130,160,180,.29)';c.beginPath();c.moveTo(x,y);c.lineTo(x+2,y+10+(i%4)*2);c.stroke();let r=(t*.7+i*.17)%1;c.globalAlpha=(1-r)*.3;c.beginPath();c.ellipse(seed*w+24,h-14,r*10,r*2.5,0,0,7);c.stroke();}
 if(mode===2){c.fillStyle='rgba(161,184,199,.40)';c.beginPath();c.arc(x,y,1+(i%3)*.6,0,7);c.fill();}
 if(mode===3){c.save();c.translate(x,y);c.rotate(t*.5+i);c.scale(1,.55+Math.abs(Math.sin(t*.4+i))*.45);c.fillStyle='rgba(203,157,163,.32)';c.beginPath();c.moveTo(0,-7);c.bezierCurveTo(7,-5,7,2,0,7);c.bezierCurveTo(-5,2,-6,-4,0,-7);c.fill();c.restore();}
 if(mode===4){c.strokeStyle='rgba(131,166,192,.17)';c.beginPath();c.moveTo(x,y-9);c.lineTo(x,y);c.stroke();c.fillStyle='rgba(131,166,192,.42)';c.beginPath();c.arc(x,y,1.4,0,7);c.fill();}
 if(mode===5){c.save();c.translate(x,y);c.rotate(.4+Math.sin(t*.3+i)*.5);c.fillStyle='rgba(155,154,183,.23)';c.strokeStyle='rgba(155,154,183,.32)';c.beginPath();c.moveTo(-5,-4);c.lineTo(6,0);c.lineTo(-3,5);c.lineTo(-1,0);c.closePath();c.fill();c.stroke();c.restore();}
}
c.globalAlpha=1;
c.globalCompositeOperation='destination-out';let fade=c.createRadialGradient(w*.5,h*.51,15,w*.5,h*.51,w*.32);fade.addColorStop(0,'rgba(0,0,0,.92)');fade.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=fade;c.fillRect(0,0,w,h);c.globalCompositeOperation='source-over';}
function frame(now){if(!paused&&!reduced)time+=Math.min((now-last)/1000,.05);last=now;views.forEach(v=>draw(v,time));requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume motion':'Pause motion'};addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.full').forEach(el=>{el.classList.remove('full');el.querySelector('button').textContent='Expand'});resize()}});
</script></html>
