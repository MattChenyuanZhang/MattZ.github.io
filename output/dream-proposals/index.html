<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falling motion proposals</title>
<style>*{box-sizing:border-box}body{margin:0;color:#333;background:#fafaf8;font-family:Georgia,serif}header{padding:28px 5vw;border-bottom:1px solid #ddd}h1{font-size:30px;margin:0 0 12px}p{color:#777;line-height:1.55}button{padding:8px 12px;background:white;border:1px solid #ccc;border-radius:4px;cursor:pointer;color:#444}.grid{padding:30px 5vw;display:grid;grid-template-columns:1fr 1fr;gap:30px}.scene{height:310px;background:white;position:relative;isolation:isolate;overflow:hidden;border:1px solid #e3e3df}.scene canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.sample{padding:24px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:16px;font-size:13px}.nav strong{font-family:Arial}.copy{margin:50px auto 0;max-width:78%}.copy h3{font-size:25px}.copy p{font-size:16px;color:#555}.label{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.label h2{font-size:20px;margin:0}.full{position:fixed;inset:0;background:#fafaf8;padding:24px 4vw;z-index:5;overflow:auto}.full .scene{height:78vh}.full .sample{max-width:1050px;margin:auto}.full .copy{max-width:600px;margin-top:15vh}.full .copy h3{font-size:38px}.full .copy p{font-size:21px}.full .nav{font-size:19px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style>
<header><h1>Small things, hopeful feelings.</h1><p>Eight hopeful, lightweight objects for your background. Expand a proposal to compare the movement at reading size.<br>Proposals only — your website is unchanged.</p><button id="pause">Pause motion</button></header><main class="grid" id="grid"></main>
<script>
const names=['Dandelion wishes','Little feathers','Wish stars','Ginkgo gold','Soap bubbles','Paper cranes','Cherry blossoms','Tiny parachutes'];
const desc=['My first choice. Tiny seeds with airy white-blue parachutes drift and sway. A quiet symbol of wishes taking flight.','Pale blue feathers rock softly as they fall. Light, tender, and reassuring, with the least visual weight.','Small warm-gold four-point stars fall slowly. A simple, hopeful connection to dreams, without a glitter effect.','Soft golden fan-shaped leaves tumble down. Warm and optimistic, with a more botanical, autumnal character.','Transparent pastel bubbles float gently down and sideways. Playful and luminous, with a very faint rim.','Small folded cranes in powder blue glide downward. A symbol of hope and possibility, with a slightly more detailed silhouette.','Blush five-petal flowers turn slowly as they descend. Gentle, joyful, and familiar, with a soft spring feeling.','Little pale-blue parachutes carry a tiny gold seed. A whimsical idea: bringing a dream gently down to earth.'];
let paused=false,time=0,last=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,views=[];
for(let mode=0;mode<8;mode++){let card=document.createElement('section');card.innerHTML=`<div class="scene"><canvas aria-hidden="true"></canvas><div class="sample"><div class="nav"><strong>Matt Zhang</strong><span>Blog &nbsp; Projects &nbsp; Resources</span></div><div class="copy"><h3>Good things to learn from.</h3><p>Ideas, people, and tools that help us do better work.</p><p>How to do Great Work — Paul Graham</p></div></div></div><div class="label"><h2>${mode+1}. ${names[mode]}</h2><button>Expand</button></div><p>${desc[mode]}</p>`;grid.append(card);let scene=card.querySelector('.scene'),canvas=card.querySelector('canvas'),v={mode,scene,canvas,c:canvas.getContext('2d'),w:0,h:0,p:null,rings:[]};views.push(v);card.querySelector('button').onclick=e=>{e.target.textContent=card.classList.toggle('full')?'Close preview':'Expand';resize()};scene.onpointermove=e=>{let r=scene.getBoundingClientRect();v.p={x:e.clientX-r.left,y:e.clientY-r.top}};scene.onpointerleave=()=>v.p=null;scene.onclick=()=>{if(mode===2&&v.p)v.rings.push({...v.p,start:time})};}
function resize(){views.forEach(v=>{let r=v.scene.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);v.w=r.width;v.h=r.height;v.canvas.width=r.width*d;v.canvas.height=r.height*d;v.c.setTransform(d,0,0,d,0,0)})}addEventListener('resize',resize);resize();
function draw(v,t){let{c,w,h,mode}=v;c.clearRect(0,0,w,h);c.lineWidth=1;c.strokeStyle='rgba(125,163,181,.25)';c.fillStyle='rgba(125,163,181,.45)';
const count=11;
for(let i=0;i<count;i++){
 let phase=(t*.022*(.65+(i%5)*.12)+(i*.3819)%1)%1;
 let y=phase*(h+34)-17, x=((i*.618033+.17)%1)*w+Math.sin(t*.3+i*2+phase*4)*19;
 let edge=Math.min(1,Math.abs(x-w*.5)/(w*.30));
 c.globalAlpha=Math.min(1,phase*12,(1-phase)*9)*(.28+.72*edge);
 c.save();c.translate(x,y);c.rotate(Math.sin(t*.35+i)*.4);c.lineWidth=.8;
 c.strokeStyle='rgba(139,166,179,.48)';c.fillStyle='rgba(163,192,207,.27)';
 if(mode===0){c.beginPath();c.moveTo(0,0);c.lineTo(1,10);c.stroke();for(let j=0;j<7;j++){let a=Math.PI+j*Math.PI/6;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*7,Math.sin(a)*7);c.stroke()}c.fillStyle='rgba(165,145,106,.55)';c.beginPath();c.ellipse(1,11,1,2,0,0,7);c.fill();}
 if(mode===1){c.rotate(.5);c.beginPath();c.moveTo(0,-9);c.bezierCurveTo(8,-6,5,3,0,8);c.bezierCurveTo(-4,1,-5,-5,0,-9);c.fill();c.beginPath();c.moveTo(0,-6);c.lineTo(0,11);for(let j=-4;j<7;j+=3){c.moveTo(0,j);c.lineTo(j<0?3:2,j-2);c.moveTo(0,j);c.lineTo(-2,j-2)}c.stroke();}
 if(mode===2){c.rotate(t*.08+i);c.fillStyle='rgba(204,179,110,.36)';c.beginPath();for(let j=0;j<8;j++){let a=j*Math.PI/4,r=j%2?1.7:7;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();}
 if(mode===3){c.rotate(i+t*.1);c.fillStyle='rgba(208,185,115,.32)';c.strokeStyle='rgba(178,161,113,.35)';c.beginPath();c.moveTo(0,5);c.lineTo(-8,-3);c.bezierCurveTo(-5,-10,-1,-7,0,-5);c.bezierCurveTo(2,-8,6,-9,8,-3);c.closePath();c.fill();c.beginPath();c.moveTo(0,10);c.lineTo(0,-4);c.moveTo(0,5);c.lineTo(-5,-3);c.moveTo(0,5);c.lineTo(5,-3);c.stroke();}
 if(mode===4){let g=c.createLinearGradient(-7,-7,7,7);g.addColorStop(0,'rgba(150,184,205,.4)');g.addColorStop(.5,'rgba(200,170,188,.18)');g.addColorStop(1,'rgba(183,194,148,.3)');c.strokeStyle=g;c.beginPath();c.arc(0,0,6+(i%3),0,7);c.stroke();c.strokeStyle='rgba(175,195,210,.32)';c.beginPath();c.arc(0,0,4+(i%3),3.4,4.5);c.stroke();}
 if(mode===5){c.rotate(.1);c.beginPath();c.moveTo(-2,2);c.lineTo(-10,-5);c.lineTo(-4,5);c.lineTo(2,3);c.lineTo(10,-7);c.lineTo(6,5);c.lineTo(2,4);c.lineTo(0,8);c.lineTo(-1,3);c.lineTo(-7,3);c.closePath();c.fill();c.stroke();c.beginPath();c.moveTo(-2,2);c.lineTo(2,3);c.lineTo(6,5);c.stroke();}
 if(mode===6){c.fillStyle='rgba(213,165,179,.32)';for(let j=0;j<5;j++){c.save();c.rotate(j*Math.PI*2/5);c.beginPath();c.ellipse(0,-4,2.3,4,0,0,7);c.fill();c.restore()}c.fillStyle='rgba(202,174,117,.45)';c.beginPath();c.arc(0,0,1.5,0,7);c.fill();}
 if(mode===7){c.beginPath();c.arc(0,0,7,Math.PI,Math.PI*2);c.lineTo(7,0);c.quadraticCurveTo(3,-2,0,0);c.quadraticCurveTo(-3,-2,-7,0);c.fill();c.stroke();c.beginPath();c.moveTo(-7,0);c.lineTo(0,9);c.lineTo(7,0);c.moveTo(0,-7);c.lineTo(0,9);c.stroke();c.fillStyle='rgba(202,174,117,.55)';c.beginPath();c.ellipse(0,10,1.5,2,0,0,7);c.fill();}
 c.restore();
}
c.globalAlpha=1;
c.globalCompositeOperation='destination-out';let fade=c.createRadialGradient(w*.5,h*.51,15,w*.5,h*.51,w*.32);fade.addColorStop(0,'rgba(0,0,0,.92)');fade.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=fade;c.fillRect(0,0,w,h);c.globalCompositeOperation='source-over';}
function frame(now){if(!paused&&!reduced)time+=Math.min((now-last)/1000,.05);last=now;views.forEach(v=>draw(v,time));requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume motion':'Pause motion'};addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.full').forEach(el=>{el.classList.remove('full');el.querySelector('button').textContent='Expand'});resize()}});
</script></html>
